<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Double Your Dating Masterclass</title>
<style>
  :root{--bg:#0d1014;--card:#161b22;--line:#262d36;--ink:#e9edf2;--muted:#9099a5;--accent:#25d366;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px}
  .card{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px}
  h1{font-size:23px;margin:0 0 6px;letter-spacing:-.02em}
  .when{color:var(--accent);font-weight:600;font-size:15px;margin:0 0 18px}
  p.sub{color:var(--muted);font-size:14.5px;margin:0 0 26px}
  label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
  input{width:100%;background:#0f141a;border:1px solid var(--line);color:var(--ink);
        padding:13px 14px;border-radius:9px;font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:26px;background:var(--accent);color:#07160c;border:0;
         padding:15px;border-radius:9px;font-weight:700;font-size:16px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .hp{position:absolute;left:-9999px}
  .msg{margin-top:18px;font-size:14px;min-height:20px}
  .ok{color:var(--accent)} .err{color:var(--bad)}
  .note{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
  .done{text-align:center;padding:14px 0}
  .done h2{color:var(--accent);font-size:20px;margin:0 0 10px}
</style>
<div class="card" id="card">
  <h1>Double Your Dating Masterclass</h1>
  <p class="when" id="when">Loading…</p>
  <p class="sub">The system my clients use to get 2 to 3 dates in 72 hours. Live, one hour, no replay.</p>
  <form id="f">
    <label for="name">Your first name</label>
    <input id="name" name="name" autocomplete="given-name" required>
    <label for="phone">WhatsApp number</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="9876543210" autocomplete="tel" required>
    <label for="email">Email (optional)</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="go" type="submit">Save my seat</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="note">You'll get a WhatsApp from TheBroThing in the next few minutes. Reply STOP at any time to be removed.</div>
</div>
<script>
  const $ = (s) => document.querySelector(s)
  fetch('/api/event-info').then((r) => r.json()).then((d) => { $('#when').textContent = d.when })
  $('#f').onsubmit = async (e) => {
    e.preventDefault()
    $('#go').disabled = true; $('#msg').className = 'msg'; $('#msg').textContent = 'Saving…'
    try {
      const r = await (await fetch('/register', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          name: $('#name').value.trim(), phone: $('#phone').value.trim(),
          email: $('#email').value.trim(), website: $('#website').value
        })
      })).json()
      if (r.ok) {
        $('#card').innerHTML = `<div class="done"><h2>You're in, ${r.first_name}.</h2>
          <p class="sub">Check WhatsApp in the next few minutes and reply <b>CONFIRMED</b> to lock your seat.</p></div>`
      } else {
        $('#msg').className = 'msg err'; $('#msg').textContent = r.error; $('#go').disabled = false
      }
    } catch {
      $('#msg').className = 'msg err'; $('#msg').textContent = 'Something went wrong. Please try again.'
      $('#go').disabled = false
    }
  }
</script>
