<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · TheBroThing Sequencer</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--ink:#e8eaed;--muted:#9aa3b2;--accent:#25d366;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .box{width:min(400px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px}
  h1{font-size:18px;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 24px;font-size:13px}
  label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
        padding:11px 12px;border-radius:8px;font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:22px;background:var(--accent);color:#08160c;border:0;
         padding:12px;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--bad);font-size:13px;margin-top:14px;min-height:18px}
  .note{color:var(--muted);font-size:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
</style>
<div class="box">
  <h1>TheBroThing Sequencer</h1>
  <p class="sub">Sign in to the campaign dashboard.</p>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <div class="note" id="note"></div>
</div>
<script>
  const $ = (s) => document.querySelector(s)
  fetch('/api/auth/mode').then((r) => r.json()).then((m) => {
    if (m.session) location.href = '/'
    $('#note').textContent = m.supabase
      ? 'Accounts are managed in Supabase. Ask Arunav to add you.'
      : 'Supabase sign-in is not configured on this server yet.'
  })
  $('#f').onsubmit = async (e) => {
    e.preventDefault()
    $('#go').disabled = true
    $('#err').textContent = ''
    try {
      const r = await (await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: $('#email').value.trim(), password: $('#password').value })
      })).json()
      if (r.ok) location.href = '/'
      else { $('#err').textContent = r.error; $('#go').disabled = false }
    } catch {
      $('#err').textContent = 'Could not reach the server. Check your connection.'
      $('#go').disabled = false
    }
  }
</script>
